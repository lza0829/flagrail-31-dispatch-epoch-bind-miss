name: flagrail
services:
  backend:
    build: ./backend
    ports: ["11800:11800"]
    volumes:
      - flagrail_data:/data
      - ./fixtures:/fixtures:ro
    environment:
      数据目录: /data
      夹具目录: /fixtures
  frontend:
    build: ./frontend
    ports: ["6800:80"]
    depends_on: [backend]
volumes:
  flagrail_data:
